<section class="editor-page">
  <header class="editor-page__topbar">
    <a class="editor-page__back-link" routerLink="/">← Back to archive</a>

    <a class="editor-page__brand" routerLink="/">Wardrobe Archive</a>

    <span></span>
  </header>

  <main class="editor-page__content">
    @if (isLoading()) {
      <div class="editor-page__state">
        <mat-spinner diameter="40" />
        <p>Loading item...</p>
      </div>
    } @else if (errorMessage()) {
      <div class="editor-page__state editor-page__state--error">
        <mat-icon>error</mat-icon>
        <p>{{ errorMessage() }}</p>
      </div>
    } @else if (item(); as item) {
      <p class="editor-page__eyebrow">Edit entry</p>
      <h1>Edit item</h1>
      <p class="editor-page__description">
        Update the selected piece in your personal wardrobe archive.
      </p>

      <app-clothing-item-form
        [initialItem]="item"
        submitButtonLabel="Save changes"
        (formSubmit)="updateItem($event)"
      />
    }
  </main>
</section>
