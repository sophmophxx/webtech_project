<section class="editor-page">
  <header class="editor-page__topbar">
    <nav class="editor-page__nav">
      <a routerLink="/">Archive</a>
      <a routerLink="/outfits">Outfits</a>
    </nav>

    <a class="editor-page__brand" routerLink="/">Wardrobe Archive</a>

    <a class="editor-page__back-link" routerLink="/"> Back to archive </a>
  </header>

  <main class="editor-page__content">
    <p class="editor-page__eyebrow">New entry</p>
    <h1>Add new item</h1>
    <p class="editor-page__description">Add a new piece to your personal wardrobe archive.</p>

    @if (errorMessage()) {
      <p class="editor-page__error">
        {{ errorMessage() }}
      </p>
    }

    <app-clothing-item-form submitButtonLabel="Add item" (formSubmit)="createItem($event)" />
  </main>
</section>
