<form class="archive-form" [formGroup]="itemForm" (ngSubmit)="submitForm()">
  <div class="archive-form__field">
    <label for="name">Name</label>

    <div>
      <input id="name" type="text" formControlName="name" placeholder="name your item" />

      @if (itemForm.controls.name.hasError('required') && itemForm.controls.name.touched) {
        <p class="archive-form__error">Name is required.</p>
      }
    </div>
  </div>

  <div class="archive-form__field">
    <label for="category">Category</label>

    <div>
      <select
        id="category"
        formControlName="category"
        required
        [class.archive-form__select--placeholder]="!itemForm.controls.category.value"
      >
        <option value="" disabled>select category</option>

        @for (category of categories; track category) {
          <option [value]="category">
            {{ category | titlecase }}
          </option>
        }
      </select>

      @if (itemForm.controls.category.hasError('required') && itemForm.controls.category.touched) {
        <p class="archive-form__error">Category is required.</p>
      }
    </div>
  </div>

  <div class="archive-form__field">
    <label for="brand">Brand</label>
    <input id="brand" type="text" formControlName="brand" placeholder="brand" />
  </div>

  <div class="archive-form__field">
    <label for="color">Color</label>
    <input id="color" type="text" formControlName="color" placeholder="color" />
  </div>

  <div class="archive-form__field">
    <label for="size">Size</label>
    <input id="size" type="text" formControlName="size" placeholder="size" />
  </div>

  <div class="archive-form__field">
    <label for="imageUrl">Image path</label>
    <input id="imageUrl" type="text" formControlName="imageUrl" placeholder="image url" />
  </div>

  <div class="archive-form__field archive-form__field--textarea">
    <label for="notes">Notes</label>
    <textarea id="notes" formControlName="notes" rows="4" placeholder="personal notes"></textarea>
  </div>

  <label class="archive-form__checkbox">
    <input type="checkbox" formControlName="favorite" />
    <span>Mark as favorite</span>
  </label>

  <div class="archive-form__actions">
    @if (cancelLink) {
      <a class="archive-form__cancel" [routerLink]="cancelLink">Cancel</a>
    }

    <button class="archive-form__submit" type="submit">
      {{ submitButtonLabel }}
    </button>
  </div>
</form>
