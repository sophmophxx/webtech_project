<form class="archive-form" [formGroup]="itemForm" (ngSubmit)="submitForm()">
  <div class="archive-form__field">
    <label for="name">Name</label>

    <div>
      <input id="name" type="text" formControlName="name" placeholder="name your item" />

      @if (itemForm.controls.name.hasError('required') && itemForm.controls.name.touched) {
        <p class="archive-form__error">Name is required.</p>
      }
    </div>
  </div>

  <div class="archive-form__field">
    <label for="category">Category</label>

    <select id="category" formControlName="category">
      @for (category of categories; track category) {
        <option [value]="category">
          {{ category }}
        </option>
      }
    </select>
  </div>

  <div class="archive-form__field">
    <label for="brand">Brand</label>
    <input id="brand" type="text" formControlName="brand" placeholder="add brand" />
  </div>

  <div class="archive-form__field">
    <label for="color">Color</label>
    <input id="color" type="text" formControlName="color" placeholder="add color" />
  </div>

  <div class="archive-form__field">
    <label for="size">Size</label>
    <input id="size" type="text" formControlName="size" placeholder="add size" />
  </div>

  <div class="archive-form__field archive-form__field--upload">
    <span class="archive-form__label">Image</span>

    <div class="archive-form__upload">
      <input
        id="imageFile"
        class="archive-form__file-input"
        type="file"
        accept="image/jpeg,image/png,image/webp"
        (change)="onImageSelected($event)"
      />

      <div class="archive-form__upload-row">
        <label class="archive-form__upload-button" for="imageFile"> Choose image </label>

        <span class="archive-form__upload-status">
          {{ selectedImageName() || 'No image selected' }}
        </span>
      </div>

      <p class="archive-form__upload-hint">JPG, PNG or WEBP · max. 5 MB</p>

      <input
        id="imageUrl"
        class="archive-form__url-input"
        type="text"
        formControlName="imageUrl"
        placeholder="or paste an image URL"
      />

      @if (imagePreviewUrl(); as previewUrl) {
        <div class="archive-form__preview">
          <img [src]="previewUrl" alt="Selected item preview" />
        </div>
      }

      @if (imageUploadError()) {
        <p class="archive-form__error">{{ imageUploadError() }}</p>
      }
    </div>
  </div>

  <div class="archive-form__field archive-form__field--textarea">
    <label for="notes">Notes</label>
    <textarea
      id="notes"
      formControlName="notes"
      rows="4"
      placeholder="add personal notes"
    ></textarea>
  </div>

  <label class="archive-form__checkbox">
    <input type="checkbox" formControlName="favorite" />
    <span>Mark as favorite</span>
  </label>

  <div class="archive-form__actions">
    <button class="archive-form__submit" type="submit" [disabled]="isUploading()">
      {{ isUploading() ? 'Uploading image...' : submitButtonLabel }}
    </button>
  </div>
</form>
