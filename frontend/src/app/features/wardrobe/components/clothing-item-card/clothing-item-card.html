<mat-card
  class="wardrobe-card"
  role="link"
  tabindex="0"
  (click)="openDetails()"
  (keydown)="onCardKeyDown($event)"
>
  @if (item.imageUrl) {
    <img mat-card-image [src]="item.imageUrl" [alt]="item.name" />
  }

  <mat-card-header>
    <mat-card-title>{{ item.name }}</mat-card-title>
    <mat-card-subtitle>{{ item.category }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (item.brand) {
      <p><strong>Brand:</strong> {{ item.brand }}</p>
    }

    @if (item.color) {
      <p><strong>Farbe:</strong> {{ item.color }}</p>
    }

    @if (item.size) {
      <p><strong>Größe:</strong> {{ item.size }}</p>
    }
  </mat-card-content>

  <mat-card-actions align="end">
    <button
      mat-button
      color="warn"
      type="button"
      aria-label="Kleidungsstück löschen"
      (click)="onDeleteClick($event)"
    >
      <mat-icon>delete</mat-icon>
      Löschen
    </button>
  </mat-card-actions>
</mat-card>
