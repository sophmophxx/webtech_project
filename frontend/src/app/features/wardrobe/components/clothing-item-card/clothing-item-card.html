<mat-card
  class="wardrobe-card"
  role="link"
  tabindex="0"
  (click)="openDetails()"
  (keydown)="onCardKeyDown($event)"
>
  <div class="wardrobe-card__media">
    @if (item.imageUrl) {
      <img [src]="item.imageUrl" [alt]="item.name" />
    }
  </div>

  <div class="wardrobe-card__body">
    <p class="wardrobe-card__category">{{ item.category }}</p>

    <h2>{{ item.name }}</h2>

    <dl class="wardrobe-card__meta">
      @if (item.brand) {
        <div>
          <dt>Brand</dt>
          <dd>{{ item.brand }}</dd>
        </div>
      }

      @if (item.color) {
        <div>
          <dt>Color</dt>
          <dd>{{ item.color }}</dd>
        </div>
      }

      @if (item.size) {
        <div>
          <dt>Size</dt>
          <dd>{{ item.size }}</dd>
        </div>
      }
    </dl>

    <button
      class="wardrobe-card__delete"
      type="button"
      aria-label="Delete Item"
      (click)="onDeleteClick($event)"
    >
      <mat-icon>delete</mat-icon>
      <span>Remove</span>
    </button>
  </div>
</mat-card>
